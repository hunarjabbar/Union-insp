# FILE: docker-compose.yml
# STAGE: 1
# UPDATED: 2026-10-01
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: union-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: union_inspection
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
